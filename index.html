<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('img/a11.gif') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    .start-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.8);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.3);
    }
    .start-btn {
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.2);
    }
    .start-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="start-container">
    <h1>Wazzupppp yow! </h1>
    <button class="start-btn" onclick="goToNextPage()">Let's start</button>
  </div>

  <script>
    function goToNextPage() {
      window.location.href = "question.html"; // Replace with your actual next page URL or filename
    }
  </script>
</body>
</html>
