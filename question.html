<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Check</title>
    <style>
      body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: url('img/a4.gif') no-repeat center center/cover;
    font-family: Arial, sans-serif;
    flex-direction: column;
}
.container {
    position: relative;
    text-align: center;
}
.gif {
    width: 300px;
    align-items: flex-end;
}
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
input {
    margin-top: 20px;
    padding: 10px;
    font-size: 16px;
    border-radius: 20px;
    border: 1px solid #ccc;
    outline: none;
    width: 200px;
    text-align: center;
}
button {
    padding: 10px;
    margin-top: 10px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
}
.error {
    color: red;
    margin-top: 10px;
}
    </style>
</head>
<body>
    <input type="text" id="answer" placeholder="Type your answer here">
    <button onclick="checkAnswer()">Submit</button>
    <p class="error" id="errorMessage"></p>

  <script src="script.js"></script>
</body>
</html>
